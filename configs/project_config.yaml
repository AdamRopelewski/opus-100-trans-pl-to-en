project:
  name: pl-en-transformer
  seed: 42

paths:
  raw_data_dir: data/raw/en-pl
  processed_data_dir: data/processed/en-pl
  reports_dir: reports
  tokenizer_dir: tokenizers
  checkpoints_dir: checkpoints
  logs_dir: logs
  translations_dir: reports/translations

dataset:
  source_lang: pl
  target_lang: en
  splits:
    train_pattern: train-*.parquet
    validation_pattern: validation-*.parquet
    test_pattern: test-*.parquet

stage1_audit:
  enabled: true
  preaudit:
    deduplicate_pairs: true
    remove_identical_pairs: true
    remove_square_bracket_content: true
    min_words: 1
    max_words: 200
    max_length_ratio: 4.0
  llm:
    model: qwen2.5:7b
    endpoint: http://localhost:11434/api/generate
    batch_max_chars: 2000
    max_rows_per_batch: 200
    temperature: 0.0
    max_batch_retries: 1
    uncertain_ratio_rerun_threshold: 0.9
    verbose: false
    verbose_preview_rows: 10
  outputs:
    report_md: reports/data_audit.md
    manifest_json: reports/data_audit_manifest.json

stage2_cleaning:
  enabled: true
  filters:
    unicode_normalization: NFKC
    strip_whitespace: true
    collapse_whitespace: true
    remove_control_chars: true
    min_words: 1
    max_words: 200
    max_length_ratio: 4.0
    remove_identical_pairs: true
    dedup_scope: global
    remove_train_pairs_present_in_validation_or_test: true
    preserve_validation_test_priority: true
  outputs:
    processed_dir: data/processed/en-pl
    report_md: reports/cleaning_report.md
    manifest_json: reports/cleaning_manifest.json
    removed_examples_jsonl: reports/removed_examples.jsonl

stage3_tokenizer:
  enabled: true
  type: sentencepiece
  model_type: bpe
  vocab_size: 16000
  character_coverage: 1.0
  joint_vocab: true
  model_prefix: tokenizers/spm_pl_en
  input_sentence_size: 2000000
  shuffle_input_sentence: true
  special_tokens:
    pad: "<pad>"
    unk: "<unk>"
    bos: "<bos>"
    eos: "<eos>"
  outputs:
    training_corpus: tokenizers/spm_pl_en_train.txt
    report_md: reports/tokenizer_stats.md

stage4_dataloader:
  enabled: true
  max_seq_len: 128
  pad_to_multiple_of: 8
  bucket_by_length: true
  drop_overlength: true
  shuffle_train: true
  num_workers: 4
  pin_memory: true
  prefetch_factor: 2

stage5_model:
  enabled: true
  preset: small
  presets:
    small:
      d_model: 256
      nhead: 8
      num_encoder_layers: 4
      num_decoder_layers: 4
      dim_feedforward: 1024
      dropout: 0.1
      tie_decoder_embeddings: true
      tie_encoder_decoder_embeddings: false
    base:
      d_model: 512
      nhead: 8
      num_encoder_layers: 6
      num_decoder_layers: 6
      dim_feedforward: 2048
      dropout: 0.1
      tie_decoder_embeddings: true
      tie_encoder_decoder_embeddings: false

stage6_train:
  enabled: true
  require_cuda: true
  device: cuda
  allow_cpu_fallback: false
  precision: bf16
  fallback_precision: fp16
  optimizer: adamw
  scheduler: inverse_sqrt
  lr_peak: 1.0e-4
  warmup_steps: 8000
  weight_decay: 0.01
  label_smoothing: 0.1
  grad_clip_norm: 1.0
  micro_batch_size: 16
  grad_accum_steps: 8
  num_epochs: 100
  validate_every_steps: 500
  save_every_steps: 500
  save_best_by: validation_loss
  early_stopping_patience: 3
  log_grad_norm: true
  skip_nan_batches: true
  resume_from_checkpoint: null
  output_last_checkpoint: checkpoints/stage4_last.pt
  output_best_checkpoint: checkpoints/stage4_best.pt
  log_jsonl: logs/stage4_train.jsonl

stage7_eval:
  enabled: false
  beam_size: 4
  length_penalty: 1.0
  max_new_tokens: 128
  metrics:
    - sacrebleu
    - chrf
  save_translations: true
  num_sample_translations: 100
  outputs:
    metrics_json: reports/eval_metrics.json
    translations_tsv: reports/translations/test_translations.tsv
    samples_md: reports/translations/sample_translations.md

smoke:
  enabled: false
  limit_train_samples: 1024
  limit_validation_samples: 256
  max_steps: 20
